name: Security Scan & Deploy

# Runs on every push to main - this is the automation that replaces
# the manual "SSM in, git pull, restart" steps we did by hand.
on:
  push:
    branches: [main]

jobs:
  # ============================================================
  # Static security analysis - runs BEFORE anything ever gets
  # deployed. This is "shifting security left": catching problems
  # in code review instead of after they're live in production.
  # ============================================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Scans the Terraform code for security misconfigurations -
      # things like open security groups, unencrypted storage,
      # overly-broad IAM policies - before they'd ever be applied.
      # skip_check list = the exceptions documented and justified in
      # SECURITY_EXCEPTIONS.md (cost tradeoffs, intentional design
      # decisions, and items deferred to Phase 4). Everything else
      # is enforced - a failure here blocks deployment.
      - name: Run Checkov (Terraform security scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          quiet: true
          soft_fail: false
          skip_check: CKV_AWS_126,CKV_AWS_157,CKV_AWS_118,CKV_AWS_337,CKV_AWS_354,CKV_AWS_260,CKV_AWS_382,CKV_AWS_130,CKV_AWS_293,CKV_AWS_158,CKV_AWS_35,CKV_AWS_144,CKV_AWS_18,CKV2_AWS_62,CKV2_AWS_3,CKV_AWS_338,CKV_AWS_91,CKV_AWS_103,CKV_AWS_2,CKV2_AWS_20,CKV_AWS_150,CKV_AWS_378,CKV_AWS_145

      # Scans the app's Python dependencies for known vulnerabilities
      # (CVEs) in the exact package versions in requirements.txt.
      - name: Run Trivy (dependency vulnerability scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: app
          severity: CRITICAL,HIGH
          exit-code: 1

  # ============================================================
  # Only runs if security-scan passes. Uses OIDC (see github_oidc.tf)
  # to get temporary AWS credentials - no stored access keys - then
  # tells the EC2 server to pull the latest code and restart itself,
  # via SSM (same no-SSH approach as everywhere else in this project).
  # ============================================================
  deploy:
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::142366490091:role/securestack-github-actions
          aws-region: us-east-1

      - name: Look up current instance ID
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=securestack-app-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Found instance: $INSTANCE_ID"

      - name: Deploy latest code via SSM
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="export HOME=/root && git config --global --add safe.directory /opt/securestack && cd /opt/securestack && git pull && /opt/securestack/app/venv/bin/pip install -r app/requirements.txt && systemctl restart securestack" \
            --query "Command.CommandId" --output text)

          echo "Waiting for deployment command to finish..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)

          echo "Deployment status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
            exit 1
          fi
