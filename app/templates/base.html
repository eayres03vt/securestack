<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecureStack Inventory</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
    h1 { font-size: 1.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #ddd; }
    th { background: #f5f5f5; }
    a.button, button { display: inline-block; background: #2563eb; color: white; padding: 6px 12px; border: none; border-radius: 4px; text-decoration: none; font-size: 0.9rem; cursor: pointer; }
    a.button.secondary, button.secondary { background: #6b7280; }
    a.button.danger, button.danger { background: #dc2626; }
    form.inline { display: inline; }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; }
    input { padding: 6px 8px; width: 100%; max-width: 300px; box-sizing: border-box; }
    .flash { background: #dcfce7; padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>SecureStack Inventory</h1>
    {% if current_user.is_authenticated %}
      <div>
        <a class="button" href="{{ url_for('add_item') }}">+ Add Item</a>
        <a class="button secondary" href="{{ url_for('logout') }}">Log out</a>
      </div>
    {% endif %}
  </div>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
