<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecureStack Inventory</title>
  <!-- An external stylesheet, not an inline <style> block, on purpose -
       the app's Content-Security-Policy (default-src 'self') blocks
       inline styles by default. Same-origin files like this one are
       still allowed, which is the whole point of having the policy at
       all: it stops anything *not* served by this app from injecting
       styles (or scripts) into the page. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topbar">
    <h1>SecureStack Inventory</h1>
    {% if current_user.is_authenticated %}
      <div>
        <a class="button" href="{{ url_for('add_item') }}">+ Add Item</a>
        <a class="button secondary" href="{{ url_for('logout') }}">Log out</a>
      </div>
    {% endif %}
  </div>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
